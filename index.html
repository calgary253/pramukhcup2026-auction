<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Tournament Live Auction</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🏏 Cricket Tournament Auction</h1>
        <p>Budget: 5,000 Points | Target Squad: 11 Players | Min Bid: 50 Points</p>
    </header>

    <main class="auction-grid">
        <!-- Left Column: Current Player on Auction -->
        <section class="card current-player-section">
            <h2>Current Player</h2>
            <div id="player-card" class="player-display">
                <h3 id="active-player-name">No Player Selected</h3>
                <p>Category: <span id="active-player-cat">-</span></p>
                <p>Base Price: <span id="active-player-price">50</span> Points</p>
            </div>

            <div class="controls">
                <button onclick="nextPlayer()" class="btn primary">Next Player from List</button>
            </div>

            <div class="bidding-panel">
                <h3>Place Bid</h3>
                <label for="bidder-select">Select Team/Captain:</label>
                <select id="bidder-select"></select>
                
                <label for="bid-amount">Bid Amount:</label>
                <input type="number" id="bid-amount" min="50" step="10" value="50">
                
                <button onclick="submitBid()" class="btn success">Confirm Winning Bid</button>
            </div>
        </section>

        <!-- Right Column: Teams Status & Squads -->
        <section class="card teams-section">
            <h2>Team Standings & Budgets</h2>
            <div id="teams-container" class="teams-grid">
                <!-- Dynamically populated via JS -->
            </div>
        </section>
    </main>

    <!-- Player Pool Queue Modal/List -->
    <section class="card pool-section">
        <h2>Remaining Player Pool</h2>
        <ul id="player-pool-list" class="player-list"></ul>
    </section>

    <script src="app.js"></script>
</body>
</html>
