<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pramukh Cup - 2026 Team Auction</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Link to your stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Pramukh Cup - 2026 Team Auction</h1>
        <p>Live Team Bidding & Squad Management Dashboard</p>
    </header>

    <div class="auction-grid">
        <!-- Left Column: Active Player & Bidding Controls -->
        <div class="card current-player-section">
            <h2>Current Player</h2>
            <div class="player-display">
                <div id="active-player-cat">-</div>
                <div id="active-player-name">Select 'Next Player' to begin</div>
            </div>
            <div class="controls">
                <button onclick="nextPlayer()" class="btn primary">Next Player from List</button>
            </div>

            <div class="bidding-panel">
                <h3>Place Bid</h3>
                <div class="form-group">
                    <label for="bidder-select">Select Team/Captain:</label>
                    <select id="bidder-select"></select>
                </div>
                <div class="form-group">
                    <label for="bid-amount">Bid Amount (Points):</label>
                    <input type="number" id="bid-amount" value="50" min="50">
                </div>
                <button onclick="submitBid()" class="btn success">Confirm Winning Bid</button>
                <button onclick="undoLastBid()" class="btn danger">Undo Last Bid</button>
<button onclick="downloadSquadCSV()" class="btn primary" style="margin-top: 5px;">📥 Download Squad Lists (CSV)</button>
            </div>
        </div>

        <div class="bidding-panel">
    <h3>Place Bid</h3>
    <div class="form-group">
        <label for="bidder-select">Select Team/Captain:</label>
        <select id="bidder-select"></select>
    </div>
    <div class="form-group">
        <label for="bid-amount">Bid Amount (Points):</label>
        <input type="number" id="bid-amount" min="50" step="50" value="50">
    </div>
    <div class="bid-buttons">
        <button onclick="submitBid()" class="btn success">Confirm Winning Bid</button>
        <button onclick="undoLastBid()" class="btn danger">Undo Last Bid</button>
    </div>
    
    <!-- ADD THIS LINE BELOW TO SHOW THE ANNOUNCEMENT -->
    <div id="sold-announcement" style="margin-top: 12px; font-weight: bold; color: #34d399; text-align: center; min-height: 24px; font-size: 1.05em;"></div>
</div>

        <!-- Right Column: Team Standings -->
        <div class="card teams-section">
            <h2>Team Standings & Budgets</h2>
            <div id="teams-container" class="teams-grid">
                <!-- Teams rendered dynamically via JS -->
            </div>
        </div>
    </div>

    <!-- Remaining Player Pool Section -->
    <div class="card pool-section">
        <h2>Remaining Player Pool</h2>
        <ul id="player-pool-list" class="player-list">
            <!-- Player pool rendered dynamically via JS -->
        </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
