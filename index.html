<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pramukh Cup - 2026 Calgary Team Auction</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="dashboard-header">
        <div class="header-content">
            <h1>Pramukh Cup - 2026 Team Auction</h1>
            <p>Live Team Bidding & Squad Management Dashboard</p>
        </div>
    </header>

    <main class="auction-grid-3col">
        <!-- Column 1: Active Player & Bidding Controls -->
        <section class="card current-player-section">
            <div class="card-header">
                <h2>Active Player</h2>
            </div>
            
            <div class="player-display">
                <div id="active-player-cat" class="category-badge">-</div>
                <div id="active-player-name" class="player-name-text">Select 'Next Player' to begin</div>
            </div>

            <!-- On-Screen Sale Celebration Announcement -->
            <div id="sold-announcement" class="sold-announcement"></div>

            <div class="controls">
                <button onclick="nextPlayer()" class="btn primary btn-full">Next Player from List ➔</button>
            </div>

            <div class="bidding-panel">
                <h3>Place Bid</h3>
                <div class="form-group">
                    <label for="bidder-select">Select Team / Captain:</label>
                    <select id="bidder-select" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label for="bid-amount">Bid Amount (Points):</label>
                    <input type="number" id="bid-amount" class="form-control" min="50" step="50" value="50">
                </div>
                <div class="bid-buttons">
                    <button onclick="submitBid()" class="btn success">Confirm Winning Bid</button>
                    <button onclick="undoLastBid()" class="btn danger">Undo Last Bid</button>
                </div>
                <div style="margin-top: 15px;">
                    <button onclick="downloadSquadCSV()" class="btn primary-outline btn-full">📥 Export Squad Lists (CSV)</button>
                </div>
                
                <!-- Emergency Backup & Recovery Controls (Standard Buttons) -->
                <div style="margin-top: 15px; border-top: 1px solid #e5e7eb; padding-top: 15px;">
                    <button onclick="downloadAuctionBackup()" class="btn primary-outline btn-full" style="margin-bottom: 8px;">💾 Save Emergency Backup</button>
                    <button onclick="triggerRestoreBackup()" class="btn primary-outline btn-full">📂 Restore from Backup</button>
                </div>
            </div>
        </section>

        <!-- Column 2: Team Squads & Standings -->
        <section class="card teams-overview-card">
            <h2>Team Squads & Standings</h2>
            <div id="teams-container" class="teams-grid">
                <!-- Dynamic team cards will render here -->
            </div>
        </section>

        <!-- Column 3: Remaining Player Pool -->
        <section class="card player-pool-card">
            <h2>Remaining Player Pool</h2>
            <div class="player-pool-wrapper">
                <ul id="player-pool-list" class="player-pool-list">
                    <!-- Remaining players render here -->
                </ul>
            </div>
        </section>
    </main>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
